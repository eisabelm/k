<VirtualHost *:80>
    ServerName ccrccgame.org
    ServerAlias www.ccrccgame.org
    DocumentRoot /var/www/html/ccrccgame

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/ccrccgame.org-error.log
    CustomLog ${APACHE_LOG_DIR}/ccrccgame.org-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName ccrccgame.org
    ServerAlias www.ccrccgame.org
    DocumentRoot /var/www/html/ccrccgame

    SSLEngine On
    SSLProxyEngine On

    # Let Cloudflare handle SSL
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    <Directory /var/www/html/ccrccgame>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Proxy configuration for API
    ProxyRequests Off
    ProxyPreserveHost On

    # API proxy rules
    ProxyPass /api http://localhost:5000/api/
    ProxyPassReverse /api http://localhost:5000/api/

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Allow Cloudflare IPs
    RemoteIPHeader CF-Connecting-IP

    ErrorLog ${APACHE_LOG_DIR}/ccrccgame.org-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ccrccgame.org-ssl-access.log combined
</VirtualHost>