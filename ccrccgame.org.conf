<VirtualHost *:80>
    ServerName ccrccgame.org
    ServerAlias www.ccrccgame.org
    DocumentRoot /var/www/html/ccrccgame

    # Enable SSL Engine
    SSLEngine On
    SSLProxyEngine On

    # Allow .htaccess overrides
    <Directory /var/www/html/ccrccgame>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Rewrite rules for the SPA
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]

        # Additional security headers
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        Header set Referrer-Policy "strict-origin-when-cross-origin"

        # CORS headers for API requests
        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept"
    </Directory>

    # Proxy API requests to the Node.js backend
    ProxyPass /api http://localhost:5000/api
    ProxyPassReverse /api http://localhost:5000/api

    # Allow Cloudflare IPs
    RemoteIPHeader CF-Connecting-IP

    ErrorLog ${APACHE_LOG_DIR}/ccrccgame.org-error.log
    CustomLog ${APACHE_LOG_DIR}/ccrccgame.org-access.log combined
</VirtualHost>

# SSL VirtualHost
<VirtualHost *:443>
    ServerName ccrccgame.org
    ServerAlias www.ccrccgame.org
    DocumentRoot /var/www/html/ccrccgame

    SSLEngine On
    SSLProxyEngine On
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    # Same directory and proxy configuration as above
    <Directory /var/www/html/ccrccgame>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]

        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        Header set Referrer-Policy "strict-origin-when-cross-origin"

        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept"
    </Directory>

    ProxyPass /api http://localhost:5000/api
    ProxyPassReverse /api http://localhost:5000/api

    RemoteIPHeader CF-Connecting-IP

    ErrorLog ${APACHE_LOG_DIR}/ccrccgame.org-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ccrccgame.org-ssl-access.log combined
</VirtualHost>