<VirtualHost *:80>
    ServerName videostream
    DocumentRoot /var/www/videostream/public

    # Enable required Apache modules
    <IfModule !mod_rewrite.c>
        LoadModule rewrite_module modules/mod_rewrite.so
    </IfModule>
    <IfModule !mod_proxy.c>
        LoadModule proxy_module modules/mod_proxy.so
    </IfModule>
    <IfModule !mod_proxy_http.c>
        LoadModule proxy_http_module modules/mod_proxy_http.so
    </IfModule>

    # Proxy requests to Node.js backend
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full

    # API requests go to Node.js server
    ProxyPass /api http://127.0.0.1:5000/api
    ProxyPassReverse /api http://127.0.0.1:5000/api

    # Static files are served directly by Apache
    <Directory /var/www/videostream/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Handle SPA routing
        RewriteEngine On
        # Don't rewrite files or directories
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        # Rewrite everything else to index.html
        RewriteRule ^(.*)$ index.html [QSA,L]

        # Proper MIME types for Vite assets
        AddType application/javascript .js
        AddType text/css .css
        AddType image/svg+xml .svg
    </Directory>

    # Logging configuration
    ErrorLog ${APACHE_LOG_DIR}/videostream-error.log
    CustomLog ${APACHE_LOG_DIR}/videostream-access.log combined
</VirtualHost>